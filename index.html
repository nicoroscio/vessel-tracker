<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>RSC Vessel Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0e13;
    --surface: #111520;
    --surface2: #181e2e;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --muted: #6b7280;
    --accent: #00d4aa;
    --accent-dim: rgba(0,212,170,0.12);
    --amber: #f59e0b;
    --amber-dim: rgba(245,158,11,0.12);
    --gray-dim: rgba(107,114,128,0.15);
    --red: #ef4444;
    --sidebar: 260px;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: 'IBM Plex Sans', sans-serif; color: var(--text); }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar);
    min-width: var(--sidebar);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    z-index: 1000;
  }

  #sidebar-header {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ── Connection status ── */
  #conn-bar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 18px;
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.05em;
  }

  #conn-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.4s;
  }

  #conn-dot.connected { background: var(--accent); animation: pulse 2.5s ease-in-out infinite; }
  #conn-dot.error { background: var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  #conn-label { color: var(--muted); }

  #conn-count {
    margin-left: auto;
    padding: 2px 7px;
    border-radius: 9px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  #conn-count.complete { color: var(--accent); border-color: var(--accent); }
  #conn-count.partial { color: var(--amber); border-color: var(--amber); }
  #conn-count.hidden { display: none; }

  /* ── Vessel list ── */
  #vessel-list { flex: 1; overflow-y: auto; padding: 6px 0; }

  #vessel-list::-webkit-scrollbar { width: 3px; }
  #vessel-list::-webkit-scrollbar-track { background: transparent; }
  #vessel-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .vessel-card {
    padding: 11px 18px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.15s, border-color 0.15s;
  }

  .vessel-card:hover { background: var(--surface2); }
  .vessel-card.active { background: var(--surface2); border-left-color: var(--accent); }

  .vessel-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }

  .vstatus-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .vstatus-dot.moving { background: var(--accent); }
  .vstatus-dot.anchored { background: var(--amber); }
  .vstatus-dot.moored { background: var(--muted); }

  .vname-block {
    flex: 1;
    min-width: 0;
  }

  .vname {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .vmmsi {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    margin-top: 1px;
  }

  .vtype {
    font-size: 9px;
    color: var(--muted);
    margin-top: 1px;
  }

  .vdelete {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    line-height: 20px;
    text-align: center;
    border-radius: 3px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s, color 0.15s;
  }

  .vessel-card:hover .vdelete { opacity: 1; }
  .vdelete:hover { background: rgba(239,68,68,0.15); color: var(--red); }

  .vmeta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    padding-left: 15px;
    line-height: 1.6;
  }

  .vmeta span { color: var(--text); }

  .vlastupdate {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    padding-left: 15px;
    margin-top: 1px;
  }

  .no-data {
    padding: 16px 18px;
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
  }

  /* ── Add vessel ── */
  #add-section {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
  }

  #add-row { display: flex; gap: 6px; }

  #mmsi-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 6px 9px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  #mmsi-input::placeholder { color: var(--muted); }
  #mmsi-input:focus { border-color: var(--accent); }

  #add-btn {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 6px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }

  #add-btn:hover { background: rgba(0,212,170,0.22); }

  #add-hint { font-size: 10px; color: var(--muted); margin-top: 5px; padding: 0 2px; }
  #add-error { font-size: 10px; color: var(--red); margin-top: 4px; padding: 0 2px; display: none; }

  /* ── Map ── */
  #map { flex: 1; position: relative; }

  /* ── Leaflet overrides ── */
  .leaflet-container { background: #0d1520; font-family: 'IBM Plex Sans', sans-serif; }
  .leaflet-control-zoom { border: 1px solid var(--border2) !important; background: var(--surface) !important; }
  .leaflet-control-zoom a { background: var(--surface) !important; color: var(--text) !important; border-bottom: 1px solid var(--border2) !important; }
  .leaflet-control-zoom a:hover { background: var(--surface2) !important; }
  .leaflet-control-attribution { background: rgba(11,14,19,0.75) !important; color: var(--muted) !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: var(--muted) !important; }

  /* ── Custom popup ── */
  .vessel-popup .leaflet-popup-content-wrapper {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    padding: 0;
  }

  .vessel-popup .leaflet-popup-tip { background: var(--surface); }
  .vessel-popup .leaflet-popup-content { margin: 0; width: auto !important; }

  .popup-inner { padding: 12px 14px; min-width: 200px; }

  .popup-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
  }

  .popup-subtitle {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 8px;
    padding-bottom: 7px;
    border-bottom: 1px solid var(--border);
  }

  .popup-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
  }

  .popup-key { color: var(--muted); }
  .popup-val { color: var(--text); text-align: right; }

  .popup-section {
    margin-top: 8px;
    padding-top: 7px;
    border-top: 1px solid var(--border);
  }

  .popup-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 8px;
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .badge-moving { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(0,212,170,0.3); }
  .badge-anchored { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
  .badge-moored { background: var(--gray-dim); color: var(--muted); border: 1px solid var(--border2); }

  /* ── Vessel SVG marker ── */
  .vessel-icon { transition: opacity 0.3s; }

  /* ── Mobile toggle button ── */
  #sidebar-toggle {
    display: none;
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 1100;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    font-size: 20px;
    line-height: 40px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  #sidebar-toggle:active { background: var(--surface2); }

  /* ── Export/Import/Settings buttons ── */
  #sync-section {
    padding: 6px 14px 10px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 6px;
  }

  .sync-btn {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 5px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, color 0.15s;
  }

  .sync-btn:hover { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }

  /* ── Modal overlay (shared) ── */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 2000;
    display: flex; align-items: center; justify-content: center;
  }

  .modal-overlay.hidden { display: none; }

  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 24px 20px;
    width: 340px;
    max-width: 90vw;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  }

  .modal-box h2 { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .modal-box p { font-size: 11px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }

  .modal-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text);
    outline: none;
    margin-bottom: 12px;
  }

  .modal-input:focus { border-color: var(--accent); }

  .modal-btn-primary {
    width: 100%;
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
  }

  .modal-btn-primary:hover { background: rgba(0,212,170,0.22); }

  .modal-error { font-size: 10px; color: var(--red); margin-bottom: 8px; display: none; }

  /* ── Sync (import/export) modal ── */
  #sync-textarea {
    width: 100%;
    height: 120px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text);
    outline: none;
    resize: none;
    margin-bottom: 10px;
  }

  #sync-textarea:focus { border-color: var(--accent); }

  #sync-actions { display: flex; gap: 8px; }

  #sync-actions button {
    flex: 1;
    padding: 8px;
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    border: 1px solid var(--border2);
  }

  #sync-cancel { background: var(--surface2); color: var(--muted); }
  #sync-cancel:hover { background: var(--border2); color: var(--text); }

  #sync-confirm { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  #sync-confirm:hover { background: rgba(0,212,170,0.22); }

  #sync-status { font-size: 10px; color: var(--accent); margin-bottom: 8px; min-height: 14px; }

  /* ── Mobile responsive ── */
  @media (max-width: 640px) {
    #sidebar-toggle { display: block; }

    #app { flex-direction: column; }

    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 280px;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(0,0,0,0.5);
    }

    #sidebar.open {
      transform: translateX(0);
    }

    #sidebar-header { padding-top: 10px; }

    /* Backdrop when sidebar is open */
    #sidebar-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }

    #sidebar-backdrop.visible { display: block; }

    #map { width: 100%; height: 100vh; }

    .leaflet-control-zoom { margin-top: 60px !important; }

  }
</style>
</head>
<body>

<!-- Sync (import/export) modal -->
<div id="sync-overlay" class="modal-overlay hidden" onclick="if(event.target===this)closeSyncModal()">
  <div class="modal-box">
    <h2 id="sync-title">Export</h2>
    <p id="sync-desc">Copy the text below, then paste it on your other device using Import.</p>
    <textarea id="sync-textarea" spellcheck="false"></textarea>
    <div id="sync-status"></div>
    <div id="sync-actions">
      <button id="sync-cancel" onclick="closeSyncModal()">Cancel</button>
      <button id="sync-confirm" onclick="syncConfirm()">Copy</button>
    </div>
  </div>
</div>

<!-- Backend URL modal (shown on first use) -->
<div id="backend-overlay" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>Backend Server</h2>
    <p>Enter the URL of your vessel tracker backend (Raspberry Pi API).</p>
    <input id="backend-input" class="modal-input" type="text" placeholder="https://your-tunnel.example.com" />
    <div id="backend-error" class="modal-error">Please enter a valid URL</div>
    <button class="modal-btn-primary" onclick="saveBackendUrl()">Connect</button>
  </div>
</div>

<div id="app">
  <button id="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
  <div id="sidebar-backdrop" onclick="toggleSidebar()"></div>
  <div id="sidebar">
    <div id="sidebar-header">
      <div class="brand">RSC Enterprises</div>
      <div class="title">Vessel Tracker</div>
      <div class="subtitle" id="vessel-count">0 vessels tracked</div>
    </div>

    <div id="conn-bar">
      <div id="conn-dot"></div>
      <span id="conn-label">Connecting...</span>
      <span id="conn-count" class="hidden" title="Vessels with position data / total tracked"></span>
    </div>

    <div id="vessel-list"></div>

    <div id="add-section">
      <div id="add-row">
        <input id="mmsi-input" type="text" placeholder="MMSI number" maxlength="9"/>
        <button id="add-btn" onclick="addVessel()">+ Add</button>
      </div>
      <div id="add-hint">Enter 9-digit MMSI and press Add</div>
      <div id="add-error"></div>
    </div>

    <div id="sync-section">
      <button class="sync-btn" onclick="exportVessels()">Export</button>
      <button class="sync-btn" onclick="importVessels()">Import</button>
      <button class="sync-btn" onclick="showBackendModal()">Settings</button>
    </div>
  </div>

  <div id="map"></div>
</div>

<script>
// ══════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════
const CONFIG = {
  backendUrl: localStorage.getItem('rsc_backend_url') || '',
  pollInterval: 15000,
  trailLength: 200,
};

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
const state = {
  vessels: {},
  map: null,
  activeMMSI: null,
  pollTimer: null,
  lastPollOk: false,
};

// ══════════════════════════════════════════════
//  MAP INIT
// ══════════════════════════════════════════════
function initMap() {
  state.map = L.map('map', {
    center: [43.8, 14.5],
    zoom: 7,
    zoomControl: true,
  });

  const darkBase = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; CARTO &copy; OpenStreetMap contributors',
    maxZoom: 19,
    opacity: 1,
  });

  const seaMap = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenSeaMap contributors',
    maxZoom: 18,
    opacity: 1,
  });

  darkBase.addTo(state.map);
  seaMap.addTo(state.map);
}

// ══════════════════════════════════════════════
//  VESSEL MARKER (SVG arrow)
// ══════════════════════════════════════════════
function makeVesselIcon(cog, isMoving, isActive) {
  const heading = (cog != null && cog >= 0) ? cog : 0;
  const color = isMoving ? '#00d4aa' : '#f59e0b';
  const size = isActive ? 28 : 22;
  const half = size / 2;

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <g transform="rotate(${heading}, ${half}, ${half})">
      <polygon points="${half},2 ${size-4},${size-4} ${half},${size-6} 4,${size-4}"
        fill="${color}" stroke="${isActive ? '#fff' : 'rgba(255,255,255,0.4)'}"
        stroke-width="${isActive ? 1.5 : 0.8}" opacity="${isMoving ? 1 : 0.7}"/>
    </g>
    <circle cx="${half}" cy="${half}" r="2.5" fill="white" opacity="${isActive ? 1 : 0.6}"/>
  </svg>`;

  return L.divIcon({
    html: svg,
    className: 'vessel-icon',
    iconSize: [size, size],
    iconAnchor: [half, half],
  });
}

// ══════════════════════════════════════════════
//  UPDATE VESSEL ON MAP
// ══════════════════════════════════════════════
function updateVesselOnMap(mmsi) {
  const v = state.vessels[mmsi];
  if (!v || v.lat == null) return;

  const isMoving = v.sog != null && v.sog > 0.5;
  const isActive = state.activeMMSI === mmsi;
  const icon = makeVesselIcon(v.cog, isMoving, isActive);
  const latlng = [v.lat, v.lng];

  if (!v.marker) {
    v.marker = L.marker(latlng, { icon, zIndexOffset: isActive ? 1000 : 0 })
      .addTo(state.map)
      .on('click', () => selectVessel(mmsi));

    v.popup = L.popup({ className: 'vessel-popup', closeButton: false, offset: [0, -8] });
    v.marker.bindPopup(v.popup);
  } else {
    v.marker.setLatLng(latlng);
    v.marker.setIcon(icon);
    v.marker.setZIndexOffset(isActive ? 1000 : 0);
  }

  if (v.trail && v.trail.length > 1) {
    const trailCoords = v.trail.map(p => [p.lat, p.lng]);
    if (!v.trailPolyline) {
      v.trailPolyline = L.polyline(trailCoords, {
        color: isMoving ? '#00d4aa' : '#f59e0b',
        weight: 1.5,
        opacity: 0.4,
        dashArray: '4 4',
      }).addTo(state.map);
    } else {
      v.trailPolyline.setLatLngs(trailCoords);
      v.trailPolyline.setStyle({ color: isMoving ? '#00d4aa' : '#f59e0b' });
    }
  }

  if (isActive && v.marker.isPopupOpen()) {
    v.popup.setContent(buildPopupHTML(v));
  }
}

// ══════════════════════════════════════════════
//  POPUP HTML (rich vessel data)
// ══════════════════════════════════════════════
function buildPopupHTML(v) {
  const isMoving = v.sog != null && v.sog > 0.5;
  const statusLabel = v.nav_status || (isMoving ? 'Under way' : 'Stopped');
  const badgeClass = isMoving ? 'badge-moving' : (statusLabel.toLowerCase().includes('anchor') ? 'badge-anchored' : 'badge-moored');
  const age = v.last_position_update ? formatTimestamp(v.last_position_update) : '---';

  const subtitle = [v.flag, v.ship_type_name].filter(Boolean).join(' · ');

  let rows = '';
  function row(key, val) { if (val) rows += `<span class="popup-key">${key}</span><span class="popup-val">${val}</span>`; }

  row('MMSI', v.mmsi);
  if (v.imo) row('IMO', v.imo);
  if (v.callsign) row('Callsign', v.callsign);
  row('Speed', v.sog != null ? v.sog.toFixed(1) + ' kn' : '---');
  row('Course', v.cog != null ? v.cog.toFixed(1) + '°' : '---');
  row('Lat / Lon', (v.lat != null ? v.lat.toFixed(5) : '---') + ', ' + (v.lng != null ? v.lng.toFixed(5) : '---'));

  let voyageRows = '';
  function vrow(key, val) { if (val) voyageRows += `<span class="popup-key">${key}</span><span class="popup-val">${val}</span>`; }

  if (v.destination) vrow('Dest', v.destination);
  if (v.eta) vrow('ETA', v.eta.replace('T', ' '));
  if (v.length && v.width) vrow('Size', v.length + ' × ' + v.width + ' m');
  if (v.draught) vrow('Draught', v.draught.toFixed(1) + ' m');
  vrow('Updated', age);

  return `<div class="popup-inner">
    <div class="popup-name">${v.name || v.mmsi}</div>
    ${subtitle ? `<div class="popup-subtitle">${subtitle}</div>` : '<div class="popup-subtitle">' + v.mmsi + '</div>'}
    <div class="popup-grid">${rows}</div>
    ${voyageRows ? `<div class="popup-grid popup-section">${voyageRows}</div>` : ''}
    <span class="popup-badge ${badgeClass}">${statusLabel}</span>
  </div>`;
}

// ══════════════════════════════════════════════
//  SIDEBAR RENDER
// ══════════════════════════════════════════════
function renderSidebar() {
  const list = document.getElementById('vessel-list');
  const mmsis = Object.keys(state.vessels).sort((a, b) => {
    const aHas = state.vessels[a].lat != null ? 0 : 1;
    const bHas = state.vessels[b].lat != null ? 0 : 1;
    return aHas - bHas;
  });
  document.getElementById('vessel-count').textContent = `${mmsis.length} vessel${mmsis.length !== 1 ? 's' : ''} tracked`;

  const found = mmsis.filter(m => state.vessels[m].lat != null).length;
  const countEl = document.getElementById('conn-count');
  if (mmsis.length > 0) {
    countEl.textContent = `${found} / ${mmsis.length} found`;
    countEl.classList.remove('hidden', 'complete', 'partial');
    countEl.classList.add(found === mmsis.length ? 'complete' : 'partial');
  } else {
    countEl.classList.add('hidden');
  }

  list.innerHTML = '';
  mmsis.forEach(mmsi => {
    const v = state.vessels[mmsi];
    const isMoving = v.sog != null && v.sog > 0.5;
    const isActive = state.activeMMSI === mmsi;
    const hasData = v.lat != null;

    const dotClass = !hasData ? 'moored' : (isMoving ? 'moving' : (v.nav_status && v.nav_status.toLowerCase().includes('anchor') ? 'anchored' : 'moored'));
    const sogText = v.sog != null ? v.sog.toFixed(1) + ' kn' : '---';
    const cogText = v.cog != null ? cogToCompass(v.cog) : '---';
    const lastSeen = v.last_position_update ? `${formatTimestamp(v.last_position_update)} (${timeAgo(v.last_position_update)})` : 'waiting for data...';

    const typeInfo = [v.flag, v.ship_type_name].filter(Boolean).join(' · ');

    const card = document.createElement('div');
    card.className = 'vessel-card' + (isActive ? ' active' : '');
    card.innerHTML = `
      <div class="vessel-card-top">
        <div class="vstatus-dot ${dotClass}"></div>
        <div class="vname-block">
          <div class="vname">${v.name || v.mmsi}</div>
          <div class="vmmsi">${v.mmsi}${typeInfo ? ' · ' + typeInfo : ''}</div>
        </div>
        <button class="vdelete" title="Remove vessel">&times;</button>
      </div>
      <div class="vmeta">${hasData ? `<span>${sogText}</span> &middot; <span>${cogText}</span>` : 'No data yet'}</div>
      <div class="vlastupdate">${lastSeen}</div>`;
    card.onclick = () => selectVessel(mmsi);
    card.querySelector('.vdelete').onclick = (e) => { e.stopPropagation(); removeVessel(mmsi); };
    list.appendChild(card);
  });
}

function cogToCompass(deg) {
  const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return dirs[Math.round(deg / 22.5) % 16];
}

function formatTimestamp(ts) {
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');
  const ss = String(d.getSeconds()).padStart(2, '0');
  return `${dd}/${mm}/${yy} ${hh}:${min}:${ss}`;
}

function timeAgo(ts) {
  const secs = Math.floor((Date.now() - ts) / 1000);
  if (secs < 60) return 'just now';
  if (secs < 3600) return `${Math.floor(secs / 60)}m ago`;
  if (secs < 86400) return `${Math.floor(secs / 3600)}h ago`;
  return `${Math.floor(secs / 86400)}d ago`;
}

// ══════════════════════════════════════════════
//  API CALLS
// ══════════════════════════════════════════════
async function apiFetch(path, opts = {}) {
  if (!CONFIG.backendUrl) throw new Error('No backend URL configured');
  const url = CONFIG.backendUrl.replace(/\/+$/, '') + path;
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(`API ${res.status}`);
  return res.json();
}

async function pollVessels() {
  try {
    const vessels = await apiFetch('/api/watchlist/vessels');
    setConnStatus('connected');
    state.lastPollOk = true;

    const serverMMSIs = new Set();

    vessels.forEach(row => {
      const mmsi = row.mmsi;
      if (!mmsi) return;
      serverMMSIs.add(mmsi);

      const existing = state.vessels[mmsi];
      state.vessels[mmsi] = {
        mmsi,
        name: row.name || (existing?.name) || mmsi,
        imo: row.imo || null,
        callsign: row.callsign || null,
        flag: row.flag || null,
        ship_type: row.ship_type ?? null,
        ship_type_name: row.ship_type_name || null,
        length: row.length || null,
        width: row.width || null,
        draught: row.draught ?? null,
        destination: row.destination || null,
        eta: row.eta || null,
        lat: row.lat ?? (existing?.lat) ?? null,
        lng: row.lng ?? (existing?.lng) ?? null,
        sog: row.sog ?? null,
        cog: row.cog ?? null,
        heading: row.heading ?? null,
        nav_status: row.nav_status || null,
        last_position_update: row.last_position_update || (existing?.last_position_update) || null,
        last_static_update: row.last_static_update || null,
        trail: existing?.trail || [],
        marker: existing?.marker || null,
        trailPolyline: existing?.trailPolyline || null,
        popup: existing?.popup || null,
      };
    });

    // Remove vessels that were deleted from the watchlist on another device
    Object.keys(state.vessels).forEach(mmsi => {
      if (!serverMMSIs.has(mmsi)) {
        const v = state.vessels[mmsi];
        if (v.marker) state.map.removeLayer(v.marker);
        if (v.trailPolyline) state.map.removeLayer(v.trailPolyline);
        if (state.activeMMSI === mmsi) state.activeMMSI = null;
        delete state.vessels[mmsi];
      }
    });

    Object.keys(state.vessels).forEach(mmsi => updateVesselOnMap(mmsi));
    renderSidebar();
    saveCache();
  } catch (e) {
    console.warn('[Poll] Failed:', e.message);
    setConnStatus('error');
    state.lastPollOk = false;
  }
}

async function fetchTrail(mmsi) {
  try {
    const trail = await apiFetch(`/api/vessel/${mmsi}/trail?hours=24`);
    const v = state.vessels[mmsi];
    if (v) {
      v.trail = trail.map(p => ({ lat: p.lat, lng: p.lng }));
      updateVesselOnMap(mmsi);
    }
  } catch (e) {
    console.warn('[Trail] Failed for', mmsi, e.message);
  }
}

// ══════════════════════════════════════════════
//  ADD VESSEL
// ══════════════════════════════════════════════
async function addVessel() {
  const input = document.getElementById('mmsi-input');
  const errDiv = document.getElementById('add-error');
  const mmsi = input.value.trim().replace(/\s/g, '');

  errDiv.style.display = 'none';

  if (!/^\d{9}$/.test(mmsi)) {
    errDiv.textContent = 'MMSI must be exactly 9 digits';
    errDiv.style.display = 'block';
    return;
  }

  if (state.vessels[mmsi]) {
    errDiv.textContent = 'Already in watchlist';
    errDiv.style.display = 'block';
    return;
  }

  try {
    await apiFetch(`/api/watchlist/${mmsi}`, { method: 'POST' });

    state.vessels[mmsi] = {
      mmsi, name: mmsi,
      imo: null, callsign: null, flag: null,
      ship_type: null, ship_type_name: null,
      length: null, width: null, draught: null,
      destination: null, eta: null,
      lat: null, lng: null, sog: null, cog: null, heading: null,
      nav_status: null, last_position_update: null, last_static_update: null,
      trail: [], marker: null, trailPolyline: null, popup: null,
    };

    input.value = '';
    renderSidebar();
    saveCache();

    pollVessels();
  } catch (e) {
    errDiv.textContent = 'Failed to add — check backend connection';
    errDiv.style.display = 'block';
  }
}

// ══════════════════════════════════════════════
//  REMOVE VESSEL
// ══════════════════════════════════════════════
async function removeVessel(mmsi) {
  const v = state.vessels[mmsi];
  if (!v) return;

  if (v.marker) state.map.removeLayer(v.marker);
  if (v.trailPolyline) state.map.removeLayer(v.trailPolyline);
  if (state.activeMMSI === mmsi) state.activeMMSI = null;
  delete state.vessels[mmsi];
  renderSidebar();
  saveCache();

  try {
    await apiFetch(`/api/watchlist/${mmsi}`, { method: 'DELETE' });
  } catch (e) {
    console.warn('[Remove] API call failed:', e.message);
  }
}

// ══════════════════════════════════════════════
//  SELECT VESSEL
// ══════════════════════════════════════════════
function selectVessel(mmsi) {
  state.activeMMSI = mmsi;
  const v = state.vessels[mmsi];

  Object.keys(state.vessels).forEach(m => updateVesselOnMap(m));
  renderSidebar();

  if (v.lat != null) {
    state.map.setView([v.lat, v.lng], Math.max(state.map.getZoom(), 10), { animate: true });
    v.popup.setContent(buildPopupHTML(v));
    setTimeout(() => v.marker.openPopup(), 10);
  }

  fetchTrail(mmsi);

  if (window.innerWidth <= 640) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-backdrop').classList.remove('visible');
    const toggle = document.getElementById('sidebar-toggle');
    toggle.innerHTML = '&#9776;';
    toggle.style.left = '12px';
  }
}

// ══════════════════════════════════════════════
//  CONNECTION STATUS UI
// ══════════════════════════════════════════════
function setConnStatus(status) {
  const dot = document.getElementById('conn-dot');
  const label = document.getElementById('conn-label');
  dot.className = '';
  if (status === 'connected') {
    dot.classList.add('connected');
    label.textContent = 'Live · Backend';
    label.style.color = 'var(--accent)';
  } else if (status === 'error') {
    dot.classList.add('error');
    label.textContent = 'Backend unreachable';
    label.style.color = 'var(--red)';
  } else if (status === 'no-backend') {
    label.textContent = 'No backend configured';
    label.style.color = 'var(--amber)';
  } else {
    label.textContent = 'Connecting...';
    label.style.color = 'var(--muted)';
  }
}

// ══════════════════════════════════════════════
//  LOCALSTORAGE CACHE
// ══════════════════════════════════════════════
const CACHE_KEY = 'rsc_vessel_cache';

function saveCache() {
  try {
    const data = {};
    Object.entries(state.vessels).forEach(([mmsi, v]) => {
      data[mmsi] = {
        mmsi: v.mmsi, name: v.name,
        imo: v.imo, callsign: v.callsign, flag: v.flag,
        ship_type: v.ship_type, ship_type_name: v.ship_type_name,
        length: v.length, width: v.width, draught: v.draught,
        destination: v.destination, eta: v.eta,
        lat: v.lat, lng: v.lng, sog: v.sog, cog: v.cog,
        heading: v.heading, nav_status: v.nav_status,
        last_position_update: v.last_position_update,
      };
    });
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('[Cache] Save failed:', e);
  }
}

function loadCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    Object.entries(data).forEach(([mmsi, saved]) => {
      state.vessels[mmsi] = {
        ...saved,
        trail: [],
        marker: null,
        trailPolyline: null,
        popup: null,
      };
    });
  } catch (e) {
    console.warn('[Cache] Load failed:', e);
  }
}

// ══════════════════════════════════════════════
//  MOBILE SIDEBAR TOGGLE
// ══════════════════════════════════════════════
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  const toggle = document.getElementById('sidebar-toggle');
  const isOpen = sidebar.classList.toggle('open');
  backdrop.classList.toggle('visible');
  toggle.innerHTML = isOpen ? '&times;' : '&#9776;';
  toggle.style.left = isOpen ? '244px' : '12px';
}

// ══════════════════════════════════════════════
//  EXPORT / IMPORT
// ══════════════════════════════════════════════
let _syncMode = null;

function exportVessels() {
  const mmsis = Object.keys(state.vessels);
  if (mmsis.length === 0) { alert('No vessels to export.'); return; }

  const data = {};
  mmsis.forEach(mmsi => {
    const v = state.vessels[mmsi];
    data[mmsi] = { mmsi: v.mmsi, name: v.name };
  });

  _syncMode = 'export';
  document.getElementById('sync-title').textContent = 'Export vessels';
  document.getElementById('sync-desc').textContent = 'Select all the text below, copy it, then paste it on your other device using Import.';
  document.getElementById('sync-confirm').textContent = 'Copy all';
  document.getElementById('sync-status').textContent = '';
  const ta = document.getElementById('sync-textarea');
  ta.value = JSON.stringify(data, null, 2);
  ta.readOnly = true;
  document.getElementById('sync-overlay').classList.remove('hidden');
  setTimeout(() => { ta.focus(); ta.select(); }, 100);
}

function importVessels() {
  _syncMode = 'import';
  document.getElementById('sync-title').textContent = 'Import vessels';
  document.getElementById('sync-desc').textContent = 'Paste the vessel list below (MMSI numbers), then tap Import. They will be added to the watchlist.';
  document.getElementById('sync-confirm').textContent = 'Import';
  document.getElementById('sync-status').textContent = '';
  const ta = document.getElementById('sync-textarea');
  ta.value = '';
  ta.readOnly = false;
  document.getElementById('sync-overlay').classList.remove('hidden');
  setTimeout(() => ta.focus(), 100);
}

function closeSyncModal() {
  document.getElementById('sync-overlay').classList.add('hidden');
  _syncMode = null;
}

async function syncConfirm() {
  const ta = document.getElementById('sync-textarea');
  const statusEl = document.getElementById('sync-status');

  if (_syncMode === 'export') {
    ta.focus();
    ta.select();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(() => {
          statusEl.textContent = 'Copied to clipboard!';
          setTimeout(closeSyncModal, 1200);
        }).catch(() => {
          document.execCommand('copy');
          statusEl.textContent = 'Copied! (If not, manually select all & copy)';
        });
      } else {
        document.execCommand('copy');
        statusEl.textContent = 'Copied! (If not, manually select all & copy)';
      }
    } catch (e) {
      statusEl.textContent = 'Select all text above and copy manually.';
    }
    return;
  }

  if (_syncMode === 'import') {
    const text = ta.value.trim();
    if (!text) { statusEl.textContent = 'Paste your vessel list first.'; statusEl.style.color = 'var(--red)'; return; }

    try {
      const data = JSON.parse(text);
      let added = 0;
      const mmsis = Object.keys(data).filter(m => /^\d{9}$/.test(m) && !state.vessels[m]);

      for (const mmsi of mmsis) {
        try {
          await apiFetch(`/api/watchlist/${mmsi}`, { method: 'POST' });
          added++;
        } catch (e) { /* continue */ }
      }

      await pollVessels();

      statusEl.style.color = 'var(--accent)';
      statusEl.textContent = `Added ${added} vessel(s) to watchlist!`;
      setTimeout(closeSyncModal, 1500);
    } catch (e) {
      statusEl.style.color = 'var(--red)';
      statusEl.textContent = 'Invalid format. Make sure you pasted the full exported text.';
    }
  }
}

// ══════════════════════════════════════════════
//  BACKEND URL MANAGEMENT
// ══════════════════════════════════════════════
function saveBackendUrl() {
  const input = document.getElementById('backend-input');
  const errDiv = document.getElementById('backend-error');
  let url = input.value.trim();

  if (!url || url.length < 5) {
    errDiv.style.display = 'block';
    return;
  }

  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'https://' + url;
  }
  url = url.replace(/\/+$/, '');

  errDiv.style.display = 'none';
  localStorage.setItem('rsc_backend_url', url);
  CONFIG.backendUrl = url;
  document.getElementById('backend-overlay').classList.add('hidden');

  startPolling();
}

function showBackendModal() {
  const overlay = document.getElementById('backend-overlay');
  const input = document.getElementById('backend-input');
  overlay.classList.remove('hidden');
  input.value = CONFIG.backendUrl;
  input.focus();
}

// ══════════════════════════════════════════════
//  POLLING LIFECYCLE
// ══════════════════════════════════════════════
function startPolling() {
  if (state.pollTimer) clearInterval(state.pollTimer);
  setConnStatus('connecting');
  pollVessels();
  state.pollTimer = setInterval(pollVessels, CONFIG.pollInterval);
}

// ══════════════════════════════════════════════
//  STALENESS TICKER
// ══════════════════════════════════════════════
setInterval(() => {
  renderSidebar();
  Object.values(state.vessels).forEach(v => {
    if (v.marker && v.marker.isPopupOpen()) {
      v.popup.setContent(buildPopupHTML(v));
    }
  });
}, 10000);

// ══════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════
initMap();
loadCache();
renderSidebar();

Object.keys(state.vessels).forEach(mmsi => updateVesselOnMap(mmsi));

const cached = Object.values(state.vessels).filter(v => v.lat != null);
if (cached.length === 1) {
  state.map.setView([cached[0].lat, cached[0].lng], 10, { animate: false });
} else if (cached.length > 1) {
  const bounds = L.latLngBounds(cached.map(v => [v.lat, v.lng]));
  state.map.fitBounds(bounds.pad(0.15), { animate: false });
}

if (CONFIG.backendUrl) {
  startPolling();
} else {
  setConnStatus('no-backend');
  showBackendModal();
}

document.getElementById('mmsi-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addVessel();
});

document.getElementById('backend-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveBackendUrl();
});
</script>
